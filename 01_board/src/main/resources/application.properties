spring.application.name=01_board

# 데이터베이스 설정
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/db_board
spring.datasource.username=greenit
spring.datasource.password=greenit

# classpath에 저장한 schema.sql(DDL)과 data.sql(DML)을 실행
spring.sql.init.mode=always
# 플렛폼을 적어주면 sql파일에 뒤에 동일한 플렛폼을 기제(data-mysql.sql)
# 아래 프로퍼티를 추가하면 data-mysql.sql과 schema-mysql.sql 파일명을 사용
# spring.sql.init.platform=mysql

# 마이바티스 설정
# mybatis.mapper-locations=mybatis/mappers/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
# mybatis.type-aliases-package=com.min.app01.dto